name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'  # ← Node.js 24 (statt 20)
          cache: 'npm'        # ← Nutzt npm Cache
      
      - name: Install dependencies
        run: npm ci  # ← Besser als "npm install" für CI/CD
      
      - name: Build project
        run: npm run build
      
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: dist/
